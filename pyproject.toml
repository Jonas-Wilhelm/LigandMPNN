[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandmpnn"
version = "1.0.0"
description = "Atomic context-aware protein sequence design using LigandMPNN"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "numpy>=1.23",
    "scipy>=1.12",
    "torch>=2.2",
    "ProDy>=2.4",
    "pandas>=2.0",
    "ml-collections>=0.1.1",
    "dm-tree>=0.1.8",
]

[project.scripts]
ligandmpnn-run = "ligandmpnn.run:main_cli"
ligandmpnn-score = "ligandmpnn.score:main_cli"
ligandmpnn-fetch-weights = "ligandmpnn.fetch_weights:main_cli"

[tool.setuptools.packages.find]
include = ["ligandmpnn*"]
